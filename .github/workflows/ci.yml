name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Protocol, network and animation tooling tests
        run: python -B -m unittest discover -s tests -v

  native:
    name: MSVC x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Build DLL and run native tests
        shell: powershell
        run: ./tools/build_native.ps1 -Test
      - name: Compile public headers independently
        shell: powershell
        run: ./tools/check_native_headers.ps1
      - name: Check player ZIP, required Python and separate symbols
        shell: powershell
        run: ./tests/test_package.ps1
