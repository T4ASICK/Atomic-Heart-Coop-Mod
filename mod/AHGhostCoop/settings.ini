[Visual]
; runner = previous model, story_p3 = hybrid, procedural_p3 = authored pose preview.
CharacterModel=procedural_p3
; Centimeters relative to the capsule-base visual anchor (base + 90 cm).
FeetOffset=-90
; Runner mesh forward-axis correction in degrees.
MeshYawOffset=0
NameHeight=210
; Separate calibration for the story P3 preview, in centimeters/degrees.
StoryFeetOffset=-90
StoryMeshYawOffset=0
; Calibration for the authored in-place procedural profile.
ProceduralFeetOffset=-90
ProceduralMeshYawOffset=0

[Diagnostics]
; Opt-in 10 Hz expected/applied bone readback, capped at 600 pairs per recording.
; Writes state/native_pose_probe.jsonl; disable again after capturing a QA run.
PoseProbe=0
